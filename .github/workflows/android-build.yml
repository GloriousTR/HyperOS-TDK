name: Android Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify LSPosed module metadata
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'META-INF/xposed/java_init.list'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'META-INF/xposed/scope.list'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'META-INF/xposed/module.prop'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-TDK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
